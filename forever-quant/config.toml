# ForeverQuant 配置。所有金额单位：铜币（1g = 10000）。

[market]
# 可选: forever.{normal|pvp|rp}.{horde|alliance}.{us|eu}
id = "forever.normal.horde.us"

[api]
base = "https://api.ahledger.com/v1"
user_agent = "forever-quant/0.1 (personal AH analysis)"
min_interval_minutes = 30      # 两次全量价格表之间的最短间隔
detail_top_n = 80              # 对日销最高的这么多个候选拉明细，用历史最低价复核

[capital]
total = 10000                  # 1g（手头金币变了就改这里）
reserve_pct = 0.20             # 现金储备，不动用
max_per_item = 3000            # 单一商品最大持仓 30s
max_per_trade = 3000           # 单笔上限 30s

[strategy]
ah_cut = 0.05                  # 拍卖行成交抽成（按经典规则假设，需在游戏内核实）
min_discount = 0.20            # 最低价相对参考价至少低 20%
min_roi = 0.15
min_profit = 500               # 每笔建议最低预期净利润 5s（按买满计）
min_unit_profit = 100          # 每件净利润低于 1s 的不看，不值得点鼠标
min_sold_per_day = 2.0         # 预估日销量下限
max_market_drop = 0.20         # 当前中位价比参考价低超过 20% 视为整体下跌，不做
max_days_of_volume = 0.25      # 建议数量不超过预估日销量的 25%
max_snapshot_age_hours = 6     # 行情超过这个时间不出信号

[addon]
# 游戏插件目录；install 命令会把 addon/ForeverQuant 链接到这里
addons_dir = "~/Games/battlenet/drive_c/Program Files (x86)/World of Warcraft/_forever_/Interface/AddOns"   # 默认值；install.sh 会把本机实际路径写进 local.toml

[watch]
# 固定监控的"买来分解"货源（物品 ID）。加进来之前必须先在游戏里实际分解过一件，确认能分解。
disenchant_items = [4251]      # 4251 山地护肩（已实测能分解）

[disenchant]
# 不能分解的物品。分解表只按物品等级算期望，不知道哪些物品被游戏标记为"无法分解"，
# 所以要靠这张名单排除。11288 强效魔法杖是玩家实测确认的；另外三根附魔师做的魔杖
# （11287 次级魔法杖、11289 次级秘法魔杖、11290 强效秘法魔杖）是按同类推断的，没有实测。
not_disenchantable = [11288, 11287, 11289, 11290]
# 实测确认可以分解的物品（买一件试过）。不在这张名单里的，报告里会标"未验证能否分解"。
# 4251 山地护肩：2026-11-12 实测 3 件，全部成功，得到灵魂之尘 1+2+1（附魔技能 1 级就能分解物品等级 26 的装备）
verified = [4251]

[gear_rule]
# 原则（玩家定的）：没有数据就按常识——练级时的过渡装，按输出优先来配。
# 所以热门后缀 = 带这类装备穿戴者"输出属性"的后缀；有挂价数据明显支持的后缀也算热门。
# 皮甲这一条有成交验证（孤狼之歹徒短裤 10s 买 65s 卖；低级近战要攻强）。其余没有成交验证。
max_level = 34                 # 35 级以上各后缀挂价没有差别，不看（39 级战场档例外，见下）
min_level = 15                 # 物品等级低于这个数的不看：等级太低，利润太低（玩家定的；11 级的明确说不看，15 是我取的线）
min_profit = 1500              # 每件估算净赚低于 15 银的不看（玩家嫌 12 银的利润太低，15 是我取的线）
# 有成交验证的组合，写成"装备类型:角色"。目前只有皮甲的近战属性（敏捷、攻强）是玩家实际卖出过的；
# 皮甲上德鲁伊要的属性（力量、智力）是按玩家说的职业需求加的，还没有成交验证。
# 成交记录（玩家报告，2026-11-12）：
#   皮甲近战：孤狼之歹徒短裤（10s 买 65s 卖）、灵猴之凶猛某件、强盗之间谍之靴、能量之切喉者手套
#   皮甲法系德/治疗：治疗之野性手套
confirmed = ["leather:melee", "leather:druid_caster"]
floor_ratio = 1.3              # 挂价不超过这件装备地板价的多少倍，才算"按垃圾价挂的"
min_gap = 3.0                  # 同一件装备上别的热门后缀至少贵这么多倍
data_premium = 2.0             # 挂价数据里相对价格达到这个倍数（样本 >= 15）的后缀，也算热门
hot_min_value = 0.5            # 属性预算至少有多大比例落在想要的属性上，才算热门
no_main_penalty = 0.5          # 没有主属性（只有副属性）的后缀，价值乘以这个系数
comp_margin = 0.15             # 估目标价时，只和"价值不比自己高出这么多"的后缀比
# 需求指数（玩家定的）：一件装备对每个会穿它的职业各有一个需求值（就是上面的价值，0~1）。
# 需求指数 = 最想要它的那个职业的需求值 + 其他也想要它的职业（需求值达到热门门槛的）的需求值 x multi_role_factor。
# 多个职业同时想要的，买家更多，所以进一步加分：每多一个职业，按它的需求值 x multi_role_bonus 加分。
multi_role_factor = 0.5
multi_role_bonus = 10
multi_role_cap = 15            # 多职业加分的上限：首饰披风七个职业都能戴，不封顶的话这一项会压过其他所有因素
# 星级：把综合分数简化成一到三星。达到 stars_3 是三星，达到 stars_2 是二星，其余一星。
stars_3 = 85
stars_2 = 55
# 替代品（玩家的经验：孤狼之歹徒短裤能卖 65 银，是因为当时没有别的更高敏捷的皮甲可买）：
# 看同类型、同部位、物品等级相差不超过 alt_level_range 的其他在售装备里，对同一个职业"同样好或更好"的有几件。
# 一件都没有 = 稀缺，加分；有而且更便宜 = 目标价不能高过它们里最便宜的那件。
alt_level_range = 3
scarcity_bonus = 10
# 特定需求（玩家的经验）：想兼职奶就需要智力撑蓝量，所以带智力的锁甲是圣骑专门找的东西。
# 对这类装备：找替代品时只认"同样带这个属性"的——一件力量耐力的锁甲，对要蓝量的圣骑不算替代品。另外加一点分。
# 数据备注（2026-11-12）：锁甲里带智力的占挂单 21%，并不少见；溢价只出现在"智力搭配力量或治疗"的后缀上
# （巨猿之 x1.46、医师之 x2.0、预言之 x1.85），纯智力、智力+精神、智力+敏捷没有溢价。所以加分给得保守。
need_bonus = 5



# 属性是我推断的后缀：命中了也不算"有成交验证"，面板里会标出来。确认过的从这里删掉。
uncertain = ["防御者之", "骑士之"]     # 这两个只查到后期版本的属性，资料片版本的原文没找到

# 不追踪的后缀：不管常识规则还是挂价数据怎么说都不算热门。
# 引导者之：玩家判断这个词条效果太弱，不值得追。
ignore = ["引导者之"]

# 好词缀（玩家定的独立一档）：攻强、法伤、治疗、攻击特效。在职业属性预算之外额外加分，但加多少和两件事挂钩：
#   1. 穿戴者有多想要：对把它当主属性的职业给足，对只当副属性的职业按副属性权重打折（比如圣骑对法伤 0.6）。
#   2. 数值大小：拿不到带后缀装备的具体点数，所以按"物品等级越高数值越大、后缀里属性越少每项越多"估——
#      等级系数 = 物品等级 / premium_full_level（最低 0.3，最高 1）；单属性后缀 x1.0，双属性 x0.7，三属性 x0.55。
#      特效装备能从提示文字里读到具体数字，就按数字相对同等级典型值的比例算。
premium_stats = ["ap", "sp", "heal", "sp_shadow", "sp_fire", "sp_frost", "sp_arcane", "sp_holy", "sp_nature"]
premium_bonus = 12             # 满额加分（主属性级别的需求 + 满数值）
premium_full_level = 34        # 物品等级到这个数算满数值
# 特效装备：提示文字里带这些词的算好特效（攻强、法伤、治疗、击中触发）。好特效的入选门槛放宽到 effect_premium_ratio。
effect_keywords = ["攻击强度", "伤害和治疗", "治疗效果", "法术", "击中时可能"]
effect_premium_ratio = 0.7

# 重点后缀：攻强/法伤/治疗叠加主属性（见上面 wearers 的说明）。在列表里加星标并排在前面。
star_min_value = 0.8
highlight_bonus = 15           # 分数加成

# 带特效的装备（鼠标提示里有"装备：""击中时可能："这类效果）。玩家经验：特效好卖。
# 没有后缀可比，所以和同类型、同部位、相近等级的其他绿装比：价格不到它们中位价的这个比例才报。
effect_max_ratio = 0.5

# 战场小号档：需求等级卡在这个范围的装备，不受上面 max_level 限制。玩家确认本服只有 39 级战场。
twink_min_req = 37
twink_max_req = 39
twink_extra = ["耐力之", "雄鹰之", "灵猴之", "自然惩戒之"]     # 小号档额外看重的后缀（来自网上的毕业装清单）

# 特定需求的属性（说明见上面 need_bonus 处）：这类装备上带这个属性的，找替代品时只认同样带它的。
[gear_rule.need_stats]
mail = ["int"]

# 角色想要什么属性（玩家定的"属性预算"模型）：
#   一件装备的属性总量是固定的。落在主属性上的全算数（1.0），落在想要的副属性上的基本也算数（0.7~0.8），
#   落在不要的属性上的就是浪费（不写就是 0）。
#   例：对法系，"智力 10"= 100%；"智力 7 + 耐力 3"≈ 90%；"智力 7 + 敏捷 3"只有 70%，敏捷那部分浪费了。
#   必须带至少一个主属性（权重 1.0）；只有副属性的后缀价值减半。
# 后缀的价值 = 它的属性预算里落在想要属性上的比例（不知道具体数值，按各属性平分预算算）。
# 每个职业：main = 主属性（绝对的，权重固定 1.0）；secondary = 副属性及其权重。
# 原则（玩家定的）：
#   - 主属性是绝对的；第一副属性很重要，但无法和主属性齐平（副属性权重最高只算到 0.9）。
#   - 法伤：法系对它的要求是主属性级别；平攻职业（圣骑等）对它只是副属性。德鲁伊不是平攻职业。
#   - 攻强：平攻职业的主属性；主法攻职业不要。
# 背景（玩家说明）：Forever 里双天赋是 40 级的事，40 级前练级时很难只做奶，所以牧师、圣骑、德鲁伊都是兼职奶。
# 法伤分系别（玩家说明）：神圣伤害基本只有圣骑要；暗影伤害牧师要，术士有些暗影有些火焰；法师是冰、火、奥。
# sp = 不分系别的法伤（魔法之、巫师之这类），所有用法术的职业都认；sp_xxx = 单系法伤，只有用这一系的职业认。
# 布甲对耐力的需求也就 0.3（玩家更正）。
[gear_rule.roles.mage]              # 法师：智力、法伤是主属性级别；只认冰、火、奥三系
main = ["int", "sp", "sp_frost", "sp_fire", "sp_arcane"]
main_weight = { sp_arcane = 0.7 }   # 玩奥法的法师少，适当降权（玩家说明）：仍算主属性级别，但需求只按 0.7 计
secondary = { spi = 0.8, sta = 0.3 }

[gear_rule.roles.warlock]           # 术士：有些暗影有些火焰
main = ["int", "sp", "sp_shadow", "sp_fire"]
secondary = { spi = 0.8, sta = 0.3 }

[gear_rule.roles.priest]            # 牧师：暗影；兼职奶所以治疗也算
main = ["int", "sp", "sp_shadow", "heal"]
secondary = { spi = 0.8, sta = 0.3 }

[gear_rule.roles.melee]             # 盗贼，以及 40 级前的猎人、增强萨：敏捷、攻强是主属性；不要法伤
main = ["agi", "ap"]
secondary = { sta = 0.5 }

[gear_rule.roles.druid_caster]      # 法系德鲁伊（玩家说明：德鲁伊有一半是直接用法伤的）：智力、法伤是主属性级别
main = ["int", "sp", "sp_nature", "sp_arcane", "heal"]     # 自然和奥术这两系是我按德鲁伊的法术填的，玩家没说，待确认
secondary = { spi = 0.8, sta = 0.3 }

[gear_rule.roles.druid]             # 德鲁伊（力量路线的那一半；玩家更正：德鲁伊不是平攻职业）：力量是主属性；智力是第一副属性；不太需要耐力
main = ["str"]                      # 攻强不算它的主属性——"攻强是主属性"只对平攻职业成立
secondary = { int = 0.8, ap = 0.6, sp = 0.6, heal = 0.6, sta = 0.3 }

[gear_rule.roles.paladin]           # 圣骑（平攻，也代表 40 级前的战士）：力量、攻强是主属性；神圣伤害也是主属性级别（玩家确认）
main = ["str", "ap", "sp_holy"]     # 神圣伤害基本只有圣骑要，而且对圣骑是主属性级别
secondary = { sta = 0.8, int = 0.8, sp = 0.6, heal = 0.6 }     # 耐力、智力待玩家确认；不分系别的法伤和治疗按平攻职业的副属性算

# 每类装备谁会穿。后缀的价值取"最匹配的那个职业"下的比例；达到 hot_min_value 才算热门。
# 重点（星标）= 攻强或法伤，再叠加这个职业的另一个主属性，并且整体浪费不多（价值 >= 80%）。
[gear_rule.wearers]
cloth = ["mage", "warlock", "priest"]
leather = ["melee", "druid", "druid_caster"] # 盗贼（以及 40 级前的猎人、增强萨）；德鲁伊（力量路线）；法系德
mail = ["paladin"]                           # 40 级前穿锁甲的是战士和圣骑，战士要的属性圣骑这组都覆盖了
weapon = ["melee", "druid", "druid_caster", "mage", "warlock", "priest", "paladin"]   # 认不出类型的武器才用这条
# 武器按类型分：这种武器上，哪些人愿意为后缀多花钱。
# 先按"谁能用这种武器"填了一版，再拿一次全量扫描核对：同一件武器上，"有人要的后缀"的最低挂价是"没人要的"的几倍（物品等级 15-40）。
# 结论：武器上有溢价的几乎只有敏捷/攻强类后缀（melee 这组：盗贼、猎人、增强萨）；法系拿武器当属性棒，并不愿意多花钱。
# 依据是挂价不是成交价，也没有玩家实测过，所以武器的结果一律标"未验证"，不会因为星级高就自动买。
weapon_dagger = ["melee"]                     # 3.23 倍（加上法系就掉到 1.28）
weapon_sword1h = ["melee", "paladin"]         # 1.96 倍（只算 melee 2.17；加上法师术士掉到 1.13）
weapon_axe1h = ["melee", "paladin"]           # 1.32 倍（只算 melee 1.76）
weapon_2h = ["melee"]                         # 双手剑/斧/长柄：1.76 倍；力量后缀（战士）单看是 1.00，没有溢价
weapon_mace2h = ["paladin", "druid", "melee"] # 1.94 倍；这一类力量后缀有溢价（2.12）
weapon_staff = ["melee"]                      # 敏捷法杖 1.65 倍（猎人、野德）；法系的智力/法伤杖只有 1.08，不算
weapon_fist = ["melee", "druid"]              # 样本不够，按常识
weapon_ranged = ["melee"]                     # 弓/枪/弩：样本不够，按常识（猎人主武器）
weapon_wand = ["mage", "warlock", "priest"]   # 样本不够，按常识
weapon_mace1h = []                            # 单手锤：怎么分都是 1.00，看不出谁愿意多花钱，先不出候选
jewelry_cloak = ["melee", "druid", "druid_caster", "mage", "warlock", "priest", "paladin"]

# 每个后缀加什么属性。前 15 个是经典的固定搭配；标了 "?" 注释的是我按名字和挂价推断的，不确定，发现不对就改。
[gear_rule.suffix_stats]
"夜枭之" = ["int", "spi"]
"雄鹰之" = ["int", "sta"]
"巨鲸之" = ["sta", "spi"]
"野熊之" = ["str", "sta"]
"巨猿之" = ["str", "int"]
"猎鹰之" = ["agi", "int"]
"野猪之" = ["str", "spi"]
"孤狼之" = ["agi", "spi"]
"猛虎之" = ["str", "agi"]
"灵猴之" = ["agi", "sta"]
"敏捷之" = ["agi"]
"智力之" = ["int"]
"精神之" = ["spi"]
"耐力之" = ["sta"]
"力量之" = ["str"]
"能量之" = ["ap"]
"治疗之" = ["heal"]
"防御之" = ["def"]
"再生之" = ["hp5"]
"专注之" = ["mp5"]
"闪避之" = ["dodge"]
"奥术防护之" = ["res"]
"火焰防护之" = ["res"]
"冰霜防护之" = ["res"]
"自然防护之" = ["res"]
"暗影防护之" = ["res"]
"奥法惩戒之" = ["sp_arcane"]
"火焰惩戒之" = ["sp_fire"]
"冰霜惩戒之" = ["sp_frost"]
"神圣惩戒之" = ["sp_holy"]
"自然惩戒之" = ["sp_nature"]
"暗影惩戒之" = ["sp_shadow"]
"魔法之" = ["sp"]                       # 玩家确认：法术伤害和治疗（一条属性，伤害治疗都加）。实例：魔法之唤雨者短帽 +14
"巫师之" = ["int", "sta", "sp"]
"引导者之" = ["int", "sp"]               # ? 法系后缀（智力 + 法伤 + 法术暴击）
"强盗之" = ["agi", "sta", "ap"]
"野兽之" = ["str", "agi", "sta"]        # of the Beast。查证（Wowhead 资料片版本物品页）：力量 + 敏捷 + 耐力。之前我填的"命中+暴击+耐力"是后期版本的
"勇士之" = ["str", "sta", "def"]
"防御者之" = ["sta", "str", "block"]     # ? of the Defender。只查到后期版本：耐力 + 力量 + 格挡/招架；资料片版本没找到原文
"骑士之" = ["sta", "sp", "def"]         # ? of the Knight。只查到后期版本：耐力 + 法术强度 + 躲闪；资料片版本应是耐力 + 法伤 + 防御，没找到原文
